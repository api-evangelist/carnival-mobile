description: >-
  Carnival Mobile ships an on-device SDK rather than a versioned HTTP API, so its lifecycle contract is
  SDK release versioning plus a published rebrand migration path. Each platform SDK is independently
  versioned with semver and released through GitHub Releases. The product has been renamed twice
  (Carnival -> Sailthru Mobile -> Marigold), and each rename produced a new package name alongside a
  published migration guide, which is the provider's de facto deprecation contract.
