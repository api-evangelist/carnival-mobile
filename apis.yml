aid: carnival-mobile
name: Carnival Mobile *
description: >-
  Carnival Mobile (carnival.io) was a mobile relationship management platform, backed by GV, that let
  marketers segment users and deliver push notifications, in-app messages, rich media and an in-app
  message stream from inside native iOS and Android apps. Sailthru acquired Carnival and rebranded the
  product Sailthru Mobile; it ships today as the Marigold Mobile SDK. The lineage is still directly
  observable: docs.carnival.io 301-redirects to docs.mobile.sailthru.com, which 301-redirects to
  sdkdevelopers.meetmarigold.com, and the current documentation still carries Carnival-era pages such as
  the iBeacons guide. The original carnivalmobile GitHub organization remains public, and the iOS,
  Android and React Native SDKs are still published to CocoaPods and npm under the first-party
  "carnival" maintainer account, which makes them the continuing distribution path for this company's
  developer surface. Carnival Mobile has no independently documented public REST API; its developer
  contract is an on-device SDK.
