description: >-
  First-party client SDKs for the Carnival Mobile product line. Carnival was rebranded to Sailthru
  Mobile and then to Marigold, so each platform has a chain of packages: the original Carnival-named
  package, the Sailthru Mobile-named package, and the current Marigold-named package. All of them are
  published under the same first-party publisher accounts (npm maintainer "carnival"; CocoaPods owners
  shared across the Carnival, SailthruMobile and Marigold pods), which is the evidence for
  official: true. Maven Central carries none of these — the Android SDK is distributed from the
  provider's own GitHub-hosted maven repository (github.com/sailthru/maven-repository).
lineage_note: >-
  react-native-carnival and the Carnival CocoaPod are the historical Carnival-era packages and are no
  longer updated; react-native-marigold and the Marigold pod are the current supported releases.
